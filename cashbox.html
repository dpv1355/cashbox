<style>

.rme{background:rgba(250,204,21,.34);color:var(--t);text-align:center;padding:3px 6px;font-size:calc(var(--fz)*.8);font-weight:bold;border-top:1px solid rgba(250,204,21,.7)}
.pchk{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0}.rmlg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:calc(var(--fz)*.85)}.rmsw{display:inline-block;width:18px;height:14px;border-radius:3px;border:2px solid;vertical-align:middle;margin-left:4px}.rmsw.on{border-color:#22a55a;background:rgba(34,197,94,.4)}.rmsw.off{border-color:#e06666;background:rgba(248,113,113,.4)}.rmsw.em{border-color:#d4a90a;background:rgba(250,204,21,.5)}

/* ===== v19: چیدمان و اندازه‌ی فرم‌ها (فقط ظاهر) ===== */
.card{padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ===== v20 ===== */
#top{position:sticky;top:0;z-index:70;box-shadow:0 2px 8px rgba(0,0,0,.35)}
header{padding:8px 18px}nav{padding:7px 14px}

.cnt td[id^="r"]{font-size:calc(var(--fz)*1.1);font-weight:800}

</style></head><body>
<div id=top><header><h1>🏦 کنترل موجودی صندوق دلاری و دیناری</h1><div id="bar"></div></header>
<nav id="nav"></nav></div><main id="m"></main>
<script>
const K='cashbox_v1',uid=()=>Date.now()*100+Math.floor(Math.random()*100);
const D={rate:0,openUSD:0,openIQD:0,cos:[],exps:[],pt:['تنخواه','هزینه','ارزی شرکت','آشپزخانه'],kit:[],per:[],sy:[],cosy:{},nm:[],cp:[],rt:['استرداد تنخواه','درآمد','دریافت از ذیحسابی'],pd:[],rd:[],tx:[],notes:{},pf:{},prate:{},prh:{},theme:0,ui:{},dor:[],dsp:[],rooms:[],rdays:{},ppl:[],bt:['سینگل','دبل'],ru:['اتاق خواب','اتاق کار'],ro:['سازمان','بعثه'],hot:[],cty:[],hcity:{},rates:[],ops:[]};
let S;try{S=Object.assign({},D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=D}
if(!S.v2){S.v2=1;if(!S.pt.includes('آشپزخانه'))S.pt.push('آشپزخانه')}
if(!S.v3){S.v3=1;S.tx.forEach(x=>{if(x.kind=='p'&&x.type=='آشپزخانه'&&x.adv===undefined&&/علی[\s\u200c]*الحساب/.test(x.desc||''))x.adv=true})}
const normP=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').trim();
S.cp.forEach(x=>x.period=normP(x.period));S.cp.forEach(x=>{if(!S.per.includes(x.period))S.per.push(x.period)});
function rmig(){if(!Array.isArray(S.rates))S.rates=[];if(!S.v6){S.v6=1;if(S.rate>0&&!S.rates.length)S.rates.push({from:'1300/01/01',rate:S.rate});S.tx.forEach(x=>{if(!(x.rate>0)&&S.rate>0)x.rate=S.rate});S.cp.forEach(x=>{if(!(x.rate>0)){const r=(S.prate&&S.prate[x.period]>0)?S.prate[x.period]:S.rate;if(r>0)x.rate=r}})}}
function rateAt(d){d=normP(d);let b=null;(S.rates||[]).forEach(e=>{if(e.from<=d&&(!b||e.from>b.from))b=e});return b?b.rate:0}
function syncRate(){const r=rateAt(today());if(r>0)S.rate=r}

/* ===== عامل‌ها و دوره‌های عملیاتی ===== */
const agKey=u=>(u&&(u.person||u.name))||'';const AGK=()=>agKey(CU);
function rekeyAgent(a,b){if(!a||a==b)return;scCommit();S.ops.forEach(o=>{if(o.agent==a)o.agent=b});allTx().forEach(x=>{if(x.ag==a)x.ag=b});allCp().forEach(x=>{if(x.ag==a)x.ag=b});try{const v=localStorage.getItem('cb_op_'+a);if(v)localStorage.setItem('cb_op_'+b,v)}catch(e){}}
function pplRen(a,b){US.forEach(u=>{if(u.person==a)u.person=b});usv();rekeyAgent(a,b)}
let SC={on:false,scope:'me',allTx:[],allCp:[],idsTx:new Set(),idsCp:new Set(),legNotes:{},legNm:[],legU:0,legI:0};
const opById=id=>(S.ops||[]).find(o=>o.id==id);
const myOps=()=>(S.ops||[]).filter(o=>o.agent==AGK());
function activeOp(){let id=null;try{id=localStorage.getItem('cb_op_'+AGK())}catch(e){}let o=opById(id);if(!o||(CU.role!='admin'&&o.agent!=AGK()))o=myOps().find(x=>x.open)||myOps()[0]||(CU.role=='admin'?S.ops[0]:null);return o||null}
function scOk(sc){if(sc=='me'||sc=='mine')return true;const A=CU.role=='admin';if(sc=='all')return A;if(sc.startsWith('ag:'))return A;if(sc.startsWith('op:')){const o=opById(sc.slice(3));return !!o&&(A||o.agent==AGK())}return false}
function scOps(){const a=activeOp();return a?[a]:[]}
function curOp(){const l=scOps();return l.length==1?l[0]:activeOp()}
const MA=()=>SC.on&&scOps().length>1;
function opsMig(){if(!Array.isArray(S.ops))S.ops=[];if(S.ops.length){S.ops.forEach(o=>{o.notes=o.notes||{};o.nm=o.nm||[]});const f0=S.ops[0];S.tx.forEach(x=>{if(!x.op){x.op=f0.id;x.ag=f0.agent}});S.cp.forEach(x=>{if(!x.op){x.op=f0.id;x.ag=f0.agent}});return}
const ag=agKey((US||[]).find(u=>u.role=='admin')||CU||{name:'admin'});const o={id:uid(),name:'دوره‌ی اولیه',agent:ag,from:'',to:'',open:true,openUSD:S.openUSD||0,openIQD:S.openIQD||0,notes:S.notes||{},nm:S.nm||[]};S.ops.push(o);
S.tx.forEach(x=>{if(!x.op){x.op=o.id;x.ag=o.agent}});S.cp.forEach(x=>{if(!x.op){x.op=o.id;x.ag=o.agent}});S.openUSD=0;S.openIQD=0;S.notes={};S.nm=[]}
function scOpen(){const L=scOps();S.openUSD=L.reduce((u,o)=>u+(+o.openUSD||0),0);S.openIQD=L.reduce((u,o)=>u+(+o.openIQD||0),0)}
function scApply(){const ids=new Set(scOps().map(o=>o.id));S.tx=SC.allTx.filter(x=>ids.has(x.op));S.cp=SC.allCp.filter(x=>ids.has(x.op));SC.idsTx=new Set(S.tx.map(x=>x.id));SC.idsCp=new Set(S.cp.map(x=>x.id));const no=curOp();if(no){no.notes=no.notes||{};no.nm=no.nm||[]}S.notes=no?no.notes:{};S.nm=no?no.nm:[];scOpen()}
function scCommit(){if(!SC.on)return;const ro=curOp();if(ro){S.tx.forEach(x=>{if(!x.op){x.op=ro.id;x.ag=ro.agent}});S.cp.forEach(x=>{if(!x.op){x.op=ro.id;x.ag=ro.agent}})}
SC.allTx=SC.allTx.filter(x=>!SC.idsTx.has(x.id)).concat(S.tx);SC.allCp=SC.allCp.filter(x=>!SC.idsCp.has(x.id)).concat(S.cp);SC.idsTx=new Set(S.tx.map(x=>x.id));SC.idsCp=new Set(S.cp.map(x=>x.id));
const no=curOp();if(no){no.notes=S.notes;no.nm=S.nm}}
function scInit(){SC.on=false;opsMig();SC.legNotes=S.notes;SC.legNm=S.nm;SC.legU=S.openUSD;SC.legI=S.openIQD;SC.allTx=S.tx;SC.allCp=S.cp;SC.scope='me';SC.on=true;scApply()}
function scRelease(){if(!SC.on)return;scCommit();S.tx=SC.allTx;S.cp=SC.allCp;S.notes=SC.legNotes;S.nm=SC.legNm;S.openUSD=SC.legU;S.openIQD=SC.legI;SC.on=false}
function masterS(){if(!SC.on)return S;scCommit();return Object.assign({},S,{tx:SC.allTx,cp:SC.allCp,notes:SC.legNotes,nm:SC.legNm,openUSD:SC.legU,openIQD:SC.legI})}
const allTx=()=>{if(!SC.on)return S.tx;scCommit();return SC.allTx},allCp=()=>{if(!SC.on)return S.cp;scCommit();return SC.allCp};
function setActive(id){scCommit();try{localStorage.setItem('cb_op_'+AGK(),id)}catch(e){}scApply();go(cur)}
function scBar(){if(!SC.on||CU.must)return '';const A=CU.role=='admin',L=A?S.ops:myOps(),a=activeOp();return ` &nbsp;|&nbsp; دوره‌ی عملیاتی: ${L.length?`<select style="width:auto;padding:2px" onchange="setActive(this.value)">${L.map(o=>`<option value="${o.id}" ${a&&a.id==o.id?'selected':''}>${A?esc(o.agent)+' — ':''}${esc(o.name)}${o.open?'':' (بسته)'}</option>`).join('')}</select>`:'<span class=er>ندارد</span>'}`}

async function cfSave(){if(!guardReg())return;const p=CF.period,dt=normP(CF.date||''),RR=rateAt(dt),rows=CF.ex.filter(x=>x.amt>0);if(CF.nf.length)return alert('ابتدا همه‌ی شرکت‌های جدید را اضافه یا از فهرست حذف کنید');if(!rows.length)return alert('مبلغی برای ثبت وجود ندارد');if(!p||!S.per.includes(p))return alert('نام دوره را از فهرست اطلاعات پایه انتخاب کنید');if(!rDate(dt))return alert('تاریخ را به شکل 1405/01/01 وارد کنید');if(!(RR>0))return alert('برای تاریخ '+dt+' نرخ تسعیر تعریف نشده است؛ ابتدا در «نرخ و موجودی اول دوره» نرخ را ثبت کنید');
const dup=rows.filter(x=>S.cp.some(z=>z.period==p&&(z.kind||'co')=='co'&&z.co==x.name));if(dup.length&&!await ask('برای '+dup.length+' شرکت در «'+p+'» قبلاً ثبت انجام شده است (مثل: '+dup.slice(0,3).map(x=>x.name).join('، ')+').\nآیا مایل به ثبت مجدد همه هستید؟'))return;
rows.forEach(x=>{const o={id:uid(),period:p,kind:'co',co:x.name,amt:x.amt,fee:!!CF.fee,advs:[],cur:CF.cur,date:dt,rate:RR};if(S.pf[p])o.sy=S.cosy[x.name]||'';S.cp.push(o)});cpf=p;save();const nrec=rows.length;CF=Object.assign(CF,{file:'',sheets:[],done:false,ex:[],nf:[],ign:0});go('cp');toast(nrec+' ردیف به محاسبه پرداخت ارزی اضافه شد ✔',1)}
function vCpf(){const sh=CF.sheets[CF.si],hdr=sh?(sh.rows[CF.hr]||[]):[],ncol=sh?Math.max(0,...sh.rows.slice(0,60).map(r=>r.length)):0,colL=c=>{const v=hdr[c];return (v!==undefined&&v!==null&&String(v).trim()?String(v).trim().slice(0,40):'ستون '+(c+1))};
const colOpts=sel=>`<option value="-1">— انتخاب کنید —</option>`+Array.from({length:ncol},(_,c)=>`<option value="${c}" ${c==sel?'selected':''}>${c+1}) ${esc(colL(c))}</option>`).join('');
const sum=CF.ex.reduce((u,x)=>u+x.amt,0),rt=rateAt(normP(CF.date||''));
return `<div class=card><h2>دریافت فایل شرکت‌ها</h2><p style="color:var(--mu);margin-top:0">فایل اکسل (xlsx، xls یا اکسل با قالب HTML) را انتخاب کنید. برنامه بر اساس ستون «نام شرکت مجری» شرکت‌ها را با فهرست شرکت‌ها تطبیق می‌دهد و ستون «مجموع ارزی» را (رند به پایین، بدون اعشار) می‌خواند. ردیف‌های تکراری یک شرکت با هم جمع می‌شوند.</p>
<div class=ctl><label>فایل اکسل<input type=file id=cff accept=".xlsx,.xls,.html,.htm,.xml,.csv" onchange="cfFile(this)"></label>${CF.file?`<span class=ok>📄 ${esc(CF.file)}</span>`:''}</div>
${sh?`<div class=ctl>${CF.sheets.length>1?`<label>برگه<select onchange="cfSet('si',this.value)">${CF.sheets.map((x,i)=>`<option value=${i} ${i==CF.si?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:''}<label>شماره‌ی ردیف عنوان ستون‌ها<input value="${CF.hr+1}" style="width:90px" onchange="cfSet('hr',this.value)"></label><label>ستون نام شرکت مجری<select onchange="cfSet('cn',this.value)">${colOpts(CF.cn)}</select></label><label>ستون مجموع ارزی<select onchange="cfSet('ca',this.value)">${colOpts(CF.ca)}</select></label><button class=b onclick="cfRun()">بررسی فایل</button></div>`:''}</div>
${CF.done?`<div class=card><h2>شرکت‌های موجود در فهرست (${CF.ex.length})</h2>
${CF.nf.length?`<p style="color:var(--mu)">ابتدا شرکت‌های جدید در جدول پایین را اضافه کنید؛ بعد از آن دوره و ثبت نهایی در اینجا نمایش داده می‌شود.</p>`:(CF.ex.length?`<div class=g><label>دوره (برای همه‌ی ردیف‌ها)<select onchange="cfOpt('period',this.value)"><option value="">انتخاب کنید</option>${S.per.map(x=>`<option ${x==CF.period?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>تاریخ پرداخت<input class=nm value="${esc(CF.date||'')}" placeholder="1405/01/01" onchange="cfOpt('date',this.value)"></label><label>ارز مبلغ<select onchange="cfOpt('cur',this.value)"><option value=usd ${CF.cur=='iqd'?'':'selected'}>دلار</option><option value=iqd ${CF.cur=='iqd'?'selected':''}>دینار</option></select></label><label>نرخ تسعیر آن تاریخ<input readonly class=nm value="${rt>0?f(rt,4)+' دینار = ۱ دلار':'⚠ نرخی تعریف نشده'}"></label><label style="flex-direction:row;align-items:center;gap:8px"><input type=checkbox style="width:auto" ${CF.fee?'checked':''} onchange="cfOpt('fee',this.checked)">اعمال کارمزد ۱٪ (بدون تیک: بدون کارمزد)</label></div><button class=b onclick="cfSave()">✔ ثبت نهایی و افزودن به محاسبه پرداخت ارزی</button>`:'')}
<div class=tw><table><thead><tr><th>ردیف</th><th>نام شرکت مجری</th><th>شرکت سیاحه</th><th>تعداد ردیف در فایل</th><th>مجموع ارزی (رند به پایین)</th><th>عملیات</th></tr></thead><tbody>${CF.ex.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(S.cosy[x.name]||'—')}</td><td>${x.cnt}</td><td><input class=nm style="min-width:120px" value="${f(x.amt,0)}" oninput="fm(this);cfAmt(${i},this)"></td><td><button class="b d" onclick="cfRm(${i})">حذف از ثبت</button></td></tr>`).join('')||'<tr><td colspan=6>موردی نیست</td></tr>'}</tbody><tfoot><tr><td colspan=4>جمع</td><td id=cftot>${f(sum,0)}</td><td></td></tr></tfoot></table></div></div>
<div class=card><h2>شرکت‌های غیر موجود در فهرست (${CF.nf.length})</h2>${CF.ign?`<p style="color:var(--mu)">${CF.ign} ردیف به‌دلیل نامعتبر بودن مبلغ نادیده گرفته شد.</p>`:''}<datalist id=cfsyl>${S.sy.map(y=>`<option value="${esc(y)}">`).join('')}</datalist>
<div class=tw><table><thead><tr><th>ردیف</th><th>نام شرکت مجری (از فایل)</th><th>مجموع ارزی</th><th>شرکت سیاحه</th><th>عملیات</th></tr></thead><tbody>${CF.nf.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${f(x.amt,0)}</td><td><input id=cfsy${i} list=cfsyl placeholder="انتخاب شرکت سیاحه" style="min-width:180px"></td><td><button class="b s" onclick="cfAdd(${i})">تأیید و افزودن به فهرست شرکت‌ها</button><button class="b d" onclick="cfDrop(${i})">نادیده گرفتن</button></td></tr>`).join('')||'<tr><td colspan=5>همه‌ی شرکت‌ها در فهرست وجود دارند ✔</td></tr>'}</tbody></table></div></div>`:''}`}
fontsReady();initU().then(()=>{if(CU&&CU.must)cur='usr';CU?go(cur):showLogin()});
</script></body></html>
